name: Conto demo giornaliero

on:
  schedule:
    - cron: "50 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: conto-demo
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VA_DATA_DIR: data
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa le librerie
        run: pip install yfinance pandas numpy requests

      - name: Crea il conto se non esiste ancora
        run: |
          mkdir -p data
          if [ ! -f data/virtual_account.json ]; then
            python virtual_account.py init --cash 10000
          fi

      - name: Aggiorna il conto
        run: python virtual_account.py update --notify

      - name: Salva lo stato
        run: |
          git config user.name "conto-demo-bot"
          git config user.email "conto-demo@users.noreply.github.com"
          git add data/virtual_account.json
          if ! git diff --cached --quiet; then
            git commit -m "Conto demo aggiornato $(date -u +%F)"
            for i in 1 2 3 4; do
              git pull --rebase origin "$GITHUB_REF_NAME" && git push && break
              sleep 10
            done
          fi
