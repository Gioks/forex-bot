name: Prova Telegram

on:
  workflow_dispatch:

jobs:
  prova:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Manda il messaggio di prova
        run: |
          curl -s -w "\nCodice: %{http_code}\n" \
            "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=Prova dal conto demo: se leggi questo, Telegram funziona."
